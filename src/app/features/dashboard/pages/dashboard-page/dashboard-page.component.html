<app-page-header title="Visão geral" subtitle="Seu mês em um relance">
  <app-month-navigator actions />
</app-page-header>

<section class="summary" aria-label="Resumo do mês">
  <app-summary-card
    label="Saldo do mês"
    tone="balance"
    [valueCents]="summary().balanceCents"
    [hint]="balanceHint()"
  />
  <app-summary-card
    label="Receitas"
    tone="income"
    [valueCents]="summary().incomeCents"
    [hint]="incomeHint()"
  />
  <app-summary-card
    label="Despesas"
    tone="expense"
    [valueCents]="summary().expenseCents"
    [hint]="expenseHint()"
  />
</section>

<div class="grid">
  <section class="panel panel--recent" aria-labelledby="recent-title">
    <header class="panel__header">
      <h2 id="recent-title" class="panel__title">Últimas transações</h2>
      <a mat-button routerLink="/transacoes">Ver todas</a>
    </header>
    @if (recent().length) {
      <app-recent-transactions [transactions]="recent()" />
    } @else {
      <app-empty-state
        icon="receipt_long"
        title="Nenhuma transação neste mês"
        message="Registre receitas e despesas para acompanhar seu saldo."
      />
    }
  </section>

  @if (alerts().length) {
    <section class="panel panel--alerts" aria-labelledby="alerts-title">
      <header class="panel__header">
        <div>
          <h2 id="alerts-title" class="panel__title">Alertas de orçamento</h2>
          <p class="panel__subtitle">{{ alertsSummary() }}</p>
        </div>
        <a mat-button routerLink="/orcamentos">Ver orçamentos</a>
      </header>
      <app-budget-alerts [alerts]="alerts()" />
    </section>
  }
</div>
