<app-page-header title="Categorias" subtitle="Organize suas transações com cores e ícones">
  <button mat-flat-button type="button" actions (click)="create('expense')">
    <mat-icon>add</mat-icon>
    Nova categoria
  </button>
</app-page-header>

@for (group of groups(); track group.type) {
  <section class="group" [attr.aria-labelledby]="'group-' + group.type">
    <header class="group__header">
      <h2 class="group__title" [id]="'group-' + group.type">{{ group.title }}</h2>
      <span class="group__count">{{ group.items.length }}</span>
    </header>

    @if (group.items.length) {
      <ul class="grid" role="list">
        @for (item of group.items; track item.category.id) {
          @let category = item.category;
          <li class="card" [style.--category-color]="category.color">
            <app-category-icon [icon]="category.icon" [color]="category.color" [size]="44" />
            <div class="card__text">
              <span class="card__name">{{ category.name }}</span>
              <span class="card__meta">{{ item.usageLabel }}</span>
            </div>
            <button
              mat-icon-button
              type="button"
              [matMenuTriggerFor]="menu"
              [attr.aria-label]="'Ações para ' + category.name"
            >
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu" xPosition="before">
              <button mat-menu-item type="button" (click)="edit(category)">
                <mat-icon>edit</mat-icon>
                <span>Editar</span>
              </button>
              <button mat-menu-item type="button" (click)="remove(category)">
                <mat-icon>delete</mat-icon>
                <span>Excluir</span>
              </button>
            </mat-menu>
          </li>
        }
        <li>
          <button type="button" class="card card--add" (click)="create(group.type)">
            <mat-icon aria-hidden="true">add</mat-icon>
            Adicionar em {{ group.title.toLowerCase() }}
          </button>
        </li>
      </ul>
    } @else {
      <app-empty-state
        icon="category"
        title="Nenhuma categoria"
        [message]="'Crie categorias de ' + group.title.toLowerCase() + ' para classificar.'"
      >
        <button mat-stroked-button type="button" (click)="create(group.type)">
          Criar categoria
        </button>
      </app-empty-state>
    }
  </section>
}
